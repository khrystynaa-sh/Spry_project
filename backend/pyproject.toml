[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, UP: modern syntax, B: likely bugs
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends(...) in argument defaults is the framework's idiom, not a bug
extend-immutable-calls = ["fastapi.Depends"]
